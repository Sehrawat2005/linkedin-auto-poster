name: Generate draft and send for review

on:
  schedule:
    - cron: "30 5 * * *" # 5:30 AM UTC = 11:00 AM IST daily — edit this to change the time
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate draft and send to Telegram
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/generateAndSend.js

      - name: Commit pending draft state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending.json history.json
          git diff --quiet --cached || git commit -m "Save pending draft awaiting review"
          git push
